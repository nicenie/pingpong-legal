<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乒乓计分板 · Ping Pong Score</title>
<style>
  :root {
    --bg: #FFFFFF; --fg: #1B1C1A; --muted: #5F5E5A; --line: rgba(0,0,0,.12);
    --accent: #0F6E56; --soft: #F1F0EC;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161A; --fg: #ECEEEC; --muted: #9A9C98; --line: rgba(255,255,255,.14);
            --accent: #5DCAA5; --soft: #1D2025; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 460px; padding: 40px 22px; }
  .mark {
    width: 56px; height: 56px; border-radius: 14px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
  }
  .mark svg { width: 34px; height: 34px; display: block; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 30px; }
  a.card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; margin-bottom: 10px; border-radius: 12px;
    background: var(--soft); color: var(--fg); text-decoration: none;
    border: 1px solid transparent; transition: border-color .15s ease;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .t { font-size: 16px; }
  a.card .s { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  a.card .arrow { color: var(--accent); font-size: 18px; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line);
           color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <circle cx="12.5" cy="12.5" r="7.5" fill="#FFFFFF"/>
      <path d="M17.6 17.6 L26 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="9" r="3.2" fill="#FFFFFF"/>
    </svg>
  </div>

  <h1>乒乓计分板</h1>
  <p class="sub">Ping Pong Score · Table Tennis</p>

  <a class="card" href="privacy.html">
    <span>
      <span class="t">隐私政策</span>
      <span class="s">Privacy Policy</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="support.html">
    <span>
      <span class="t">支持与常见问题</span>
      <span class="s">Support &amp; FAQ</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <footer>
    联系 / Contact: <a href="mailto:rankor@sina.com">rankor@sina.com</a>
  </footer>
</div>
</body>
</html>
